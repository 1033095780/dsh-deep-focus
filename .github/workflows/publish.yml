# Publishes the package to npm with Trusted Publishing (GitHub OIDC).
#
# No repository secrets are needed: the job exchanges a short-lived GitHub OIDC
# token for npm publish permission. One-time setup on npmjs.com:
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#   (repository + workflow filename "publish.yml"), and make the package public.
# The workflow needs npm >= 11.5.1, which the step below installs on Node 22.
#
# `--provenance` additionally requires the published package to declare its
# repository in package.json (see docs/publishing.md).
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC: npm Trusted Publishing, no long-lived token

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install an npm version that supports Trusted Publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Check the release tag matches package.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node --input-type=commonjs -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$version'. Bump the version or retag."
            exit 1
          fi

      - name: Syntax-check every source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find src -name '*.js' -print0)

      - name: Offline packaging smoke test
        run: node scripts/verify.mjs

      - name: Unit tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
